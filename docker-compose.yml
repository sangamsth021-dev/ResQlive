version: '3.8'

services:

  # PostgreSQL + PostGIS
  db:
    image: postgis/postgis:3-34-alpine
    container_name: resq-live-db
    environment:
      POSTGRES_DB: resq_live
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "resq_live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for BullMQ + caching)
  redis:
    image: redis:7-alpine
    container_name: resq-live-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible object storage for evidence)
  minio:
    image: minio/minio:20240801
    container_name: resq-live-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
    command: >
      server /data
      --console-address "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Console (web UI)
  minio-console:
    image: minio/minio:20240801
    container_name: resq-live-minio-console
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    command: >
      server /data --console-address "9001"
      true

volumes:
  pg_data:
  minio_data: