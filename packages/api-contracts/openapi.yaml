openapi: 3.1.0
info:
  title: ResQ Live API
  description: Offline-First Disaster Reporting & Response Platform API Specification
  version: 1.0.0
  contact:
    name: ResQ Live Engineering
    email: engineering@resq-live.org
servers:
  - url: /api/v1
    description: Primary API Gateway v1

paths:
  /auth/session:
    post:
      tags: [Authentication]
      summary: Create session (Login)
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionDto'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh tokens
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionDto'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /reports:
    post:
      tags: [Reports]
      summary: Create report (idempotent)
      operationId: createReport
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string;
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportDto'
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReportResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '409':
          $ref: '#/components/responses/409Conflict'

    get:
      tags: [Reports]
      summary: List reports
      operationId: listReports
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: category_code
          schema: { type: string }
        - in: query
          name: severity_code
          schema: { type: string }
        - in: query
          name: report_status
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: List of reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    400BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    409Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        details: { type: object }

    CreateSessionDto:
      type: object
      required: [password]
      properties:
        phone_e164: { type: string, pattern: '^\+[1-9]\d{1,14}$' }
        email: { type: string, format: email }
        password: { type: string }
        device_id: { type: string, format: uuid }

    RefreshSessionDto:
      type: object
      required: [user_id, device_id, refresh_token]
      properties:
        user_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        refresh_token: { type: string }

    SessionResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: '#/components/schemas/UserPayload' }

    TokenResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    UserPayload:
      type: object
      required: [user_id, roles, permissions]
      properties:
        user_id: { type: string, format: uuid }
        device_id: { type: string }
        organization_id: { type: string, format: uuid }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }

    CreateReportDto:
      type: object
      required: [report_id, category_code, severity_code]
      properties:
        report_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        organization_id: { type: string, format: uuid }
        category_code: { type: string }
        severity_code: { type: string }
        impact_json: { type: object }
        location_geom:
          type: object
          properties:
            type: { type: string, enum: [Point] }
            coordinates: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'

    EvidenceItem:
      type: object
      required: [evidence_id, kind, mime_type, size_bytes, sha256_hash]
      properties:
        evidence_id: { type: string, format: uuid }
        kind: { type: string, enum: [photo, video, audio, document] }
        mime_type: { type: string }
        size_bytes: { type: integer }
        sha256_hash: { type: string, pattern: '^[a-f0-9]{64}$' }

    CreateReportResponse:
      type: object
      required: [report_id, status, evidence]
      properties:
        report_id: { type: string, format: uuid }
        status: { type: string }
        evidence:
          type: array
          items:
            type: object
            properties:
              evidence_id: { type: string, format: uuid }
              storage_state: { type: string }

    ReportListResponse:
      type: object
      required: [reports, cursor, has_more]
      properties:
        reports: { type: array, items: { type: object } }
        cursor: { type: string, nullable: true }
        has_more: { type: boolean }